# 3-node Raft cluster over libp2p.
#
#   docker compose up --build
#
# 5-node cluster:
#   docker compose -f docker-compose.5.yml up --build
#
# node1 proposes "hello" when it becomes leader (PROPOSE_HELLO=1).
# Static IPs avoid Docker DNS race at startup.

services:
  node1:
    build: .
    environment:
      NODE_ID: "1"
      LISTEN_PORT: "4101"
      RAFT_VOTERS: "1,2,3"
      RAFT_PEERS: "2:172.28.0.12:4102,3:172.28.0.13:4103"
      PROPOSE_HELLO: "1"
      RUST_LOG: info
    ports:
      - "4101:4101"
    networks:
      raft:
        ipv4_address: 172.28.0.11

  node2:
    build: .
    environment:
      NODE_ID: "2"
      LISTEN_PORT: "4102"
      RAFT_VOTERS: "1,2,3"
      RAFT_PEERS: "1:172.28.0.11:4101,3:172.28.0.13:4103"
      RUST_LOG: info
    ports:
      - "4102:4102"
    networks:
      raft:
        ipv4_address: 172.28.0.12
    depends_on:
      - node1

  node3:
    build: .
    environment:
      NODE_ID: "3"
      LISTEN_PORT: "4103"
      RAFT_VOTERS: "1,2,3"
      RAFT_PEERS: "1:172.28.0.11:4101,2:172.28.0.12:4102"
      RUST_LOG: info
    ports:
      - "4103:4103"
    networks:
      raft:
        ipv4_address: 172.28.0.13
    depends_on:
      - node1
      - node2

networks:
  raft:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
