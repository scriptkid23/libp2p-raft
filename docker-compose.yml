# 6-node Raft cluster — topology in config/cluster.docker.toml
#
#   docker compose up --build
#
# Only NODE_ID differs per service; voters/peers/ports come from the shared TOML.

x-node: &node
  build: .
  volumes:
    - ./config/cluster.docker.toml:/etc/raft/cluster.toml:ro
  environment: &node-env
    CLUSTER_CONFIG: /etc/raft/cluster.toml
    RUST_LOG: info
  networks:
    - raft

services:
  node1:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: "1"
    ports:
      - "4101:4101"
    networks:
      raft:
        ipv4_address: 172.28.0.11

  node2:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: "2"
    ports:
      - "4102:4102"
    networks:
      raft:
        ipv4_address: 172.28.0.12
    depends_on:
      - node1

  node3:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: "3"
    ports:
      - "4103:4103"
    networks:
      raft:
        ipv4_address: 172.28.0.13
    depends_on:
      - node2

  node4:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: "4"
    ports:
      - "4104:4104"
    networks:
      raft:
        ipv4_address: 172.28.0.14
    depends_on:
      - node3

  node5:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: "5"
    ports:
      - "4105:4105"
    networks:
      raft:
        ipv4_address: 172.28.0.15
    depends_on:
      - node4

  node6:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: "6"
    ports:
      - "4106:4106"
    networks:
      raft:
        ipv4_address: 172.28.0.16
    depends_on:
      - node5

networks:
  raft:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
