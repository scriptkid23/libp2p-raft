# 5-node Raft cluster over libp2p.
#
#   docker compose -f docker-compose.5.yml up --build
#
# node1 proposes "hello" when it becomes leader (PROPOSE_HELLO=1).
# Majority = 3/5 for election and commit.

x-node-common: &node-common
  build: .
  environment: &node-env
    RAFT_VOTERS: "1,2,3,4,5"
    RUST_LOG: info
  networks:
    - raft

services:
  node1:
    <<: *node-common
    environment:
      <<: *node-env
      NODE_ID: "1"
      LISTEN_PORT: "4101"
      RAFT_PEERS: "2:172.28.0.12:4102,3:172.28.0.13:4103,4:172.28.0.14:4104,5:172.28.0.15:4105"
      PROPOSE_HELLO: "1"
    ports:
      - "4101:4101"
    networks:
      raft:
        ipv4_address: 172.28.0.11

  node2:
    <<: *node-common
    environment:
      <<: *node-env
      NODE_ID: "2"
      LISTEN_PORT: "4102"
      RAFT_PEERS: "1:172.28.0.11:4101,3:172.28.0.13:4103,4:172.28.0.14:4104,5:172.28.0.15:4105"
    ports:
      - "4102:4102"
    networks:
      raft:
        ipv4_address: 172.28.0.12
    depends_on:
      - node1

  node3:
    <<: *node-common
    environment:
      <<: *node-env
      NODE_ID: "3"
      LISTEN_PORT: "4103"
      RAFT_PEERS: "1:172.28.0.11:4101,2:172.28.0.12:4102,4:172.28.0.14:4104,5:172.28.0.15:4105"
    ports:
      - "4103:4103"
    networks:
      raft:
        ipv4_address: 172.28.0.13
    depends_on:
      - node2

  node4:
    <<: *node-common
    environment:
      <<: *node-env
      NODE_ID: "4"
      LISTEN_PORT: "4104"
      RAFT_PEERS: "1:172.28.0.11:4101,2:172.28.0.12:4102,3:172.28.0.13:4103,5:172.28.0.15:4105"
    ports:
      - "4104:4104"
    networks:
      raft:
        ipv4_address: 172.28.0.14
    depends_on:
      - node3

  node5:
    <<: *node-common
    environment:
      <<: *node-env
      NODE_ID: "5"
      LISTEN_PORT: "4105"
      RAFT_PEERS: "1:172.28.0.11:4101,2:172.28.0.12:4102,3:172.28.0.13:4103,4:172.28.0.14:4104"
    ports:
      - "4105:4105"
    networks:
      raft:
        ipv4_address: 172.28.0.15
    depends_on:
      - node4

networks:
  raft:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
