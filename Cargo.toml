[package]
name = "libp2p-raft"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Learning DIY mini-Raft NetworkBehaviour for rust-libp2p"

[dependencies]
# TODO(Task 1): pin exact libp2p minor after first successful cargo build if 0.54 features need tweaks
libp2p = { version = "0.54", features = ["tokio", "tcp", "noise", "yamux", "macros", "identify"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "1"
tracing = "0.1"
bytes = "1"
byteorder = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
void = "1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "three_node"
path = "examples/three_node.rs"

[[example]]
name = "echo_two_peers"
path = "examples/echo_two_peers.rs"
